<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMVIX - Pazar Yeri</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
        .header { background: #1e293b; padding: 15px; font-size: 18px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #334155; }
        .grid { display: flex; flex-direction: column; gap: 15px; padding: 15px; max-width: 400px; margin: 0 auto; }
        .product-card { background: #1e293b; border-radius: 12px; padding: 15px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .product-img { width: 100%; height: 180px; background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #94a3b8; margin-bottom: 10px; }
        .product-title { font-weight: bold; color: #ffffff; font-size: 16px; margin-bottom: 5px; }
        .product-price { color: #38bdf8; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>
    <div class="header">DEMVIX Pazar Yeri</div>

    <div class="grid">
        <div class="product-card">
            <div class="product-img">Ürün Görseli</div>
            <div class="product-title">Örnek Ürün / İlan Adı</div>
            <div class="product-price">1.500 TL</div>
        </div>
    </div>
</body>
</html>
