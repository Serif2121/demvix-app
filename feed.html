<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMVIX - Sosyal Akış</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, #0b0713 0%, #150f24 100%); 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding-bottom: 100px; 
            min-height: 100vh;
        }
        
        /* Üst Header */
        .header { 
            background: rgba(21, 15, 36, 0.85); 
            backdrop-filter: blur(10px);
            padding: 16px 20px; 
            font-size: 18px; 
            font-weight: 700; 
            color: #ffffff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-logo { display: flex; align-items: center; gap: 10px; }
        .header-logo span { background: linear-gradient(90deg, #c084fc, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Canlı Akış Kartları */
        .feed-container { display: flex; flex-direction: column; gap: 18px; padding: 20px; max-width: 450px; margin: 0 auto; }
        
        .post-card { 
            background: linear-gradient(145deg, rgba(30, 24, 48, 0.9), rgba(18, 13, 30, 0.95)); 
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }
        
        .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .author-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #ec4899); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: white; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4); }
        .post-author { font-weight: 600; color: #f3e8ff; font-size: 15px; }
        .post-time { font-size: 12px; color: #9ca3af; }
        
        .post-content { color: #e2e8f0; font-size: 15px; line-height: 1.5; margin-bottom: 15px; }
        
        /* Etkileşim Butonları (Beğeni, Yorum) */
        .post-actions { display: flex; gap: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 12px; }
        .action-btn { background: none; border: none; color: #9ca3af; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: color 0.2s; }
        .action-btn:hover { color: #c084fc; }

        /* Paylaşım Modalı */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 3, 10, 0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: linear-gradient(145deg, #1e1830, #120d1e); border: 1px solid rgba(168, 85, 247, 0.3); padding: 24px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .modal-title { font-size: 18px; font-weight: 700; color: #f3e8ff; margin-bottom: 15px; }
        .modal-content textarea { width: 100%; height: 120px; background: #0b0713; color: white; border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 14px; padding: 14px; font-size: 15px; box-sizing: border-box; margin-bottom: 15px; outline: none; resize: none; }
        .modal-content textarea:focus { border-color: #c084fc; box-shadow: 0 0 10px rgba(192, 132, 252, 0.2); }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 12px; }
        .btn-cancel { background: rgba(255, 255, 255, 0.05); color: #9ca3af; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-submit { background: linear-gradient(135deg, #a855f7, #9333ea); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }

        /* Alt Menü (Tam İstediğin Gibi Ortada Mor + Butonu) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(21, 15, 36, 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; padding: 12px 10px; border-top: 1px solid rgba(168, 85, 247, 0.15); z-index: 50; }
        .nav-item { color: #9ca3af; text-decoration: none; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.2s; }
        .nav-item.active, .nav-item:hover { color: #c084fc; }
        
        .nav-center-btn { 
            background: linear-gradient(135deg, #c084fc, #9333ea); 
            color: white; 
            border: none; 
            width: 52px; 
            height: 52px; 
            border-radius: 50%; 
            font-size: 28px; 
            font-weight: bold; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5); 
            margin-top: -15px;
            transition: transform 0.2s;
        }
        .nav-center-btn:active { transform: scale(0.92); }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-logo">
            <div style="width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #ec4899); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">D</div>
            <span>DEMVIX</span>
        </div>
    </div>

    <div class="feed-container" id="feedList">
        <div class="post-card">
            <div class="post-header">
                <div class="author-info">
                    <div class="avatar">DR</div>
                    <div>
                        <div class="post-author">DEMVIX Resmi</div>
                        <div class="post-time">Şimdi</div>
                    </div>
                </div>
            </div>
            <div class="post-content">Küresel sosyal ağ ve ticaret platformumuz ultra renk kalitesi ve yenilenen premium tasarımıyla yayında! 🚀</div>
            <div class="post-actions">
                <button class="action-btn">❤️ 142</button>
                <button class="action-btn">💬 24</button>
            </div>
        </div>
    </div>

    <!-- Paylaşım Modalı -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-title">Yeni Gönderi Paylaş</div>
            <textarea id="postText" placeholder="Aklından ne geçiyor?"></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">İptal</button>
                <button class="btn-submit" onclick="submitPost()">Paylaş</button>
            </div>
        </div>
    </div>

        <!-- Alt Menü Yapısı -->
<div class="bottom-nav">
    <a href="feed.html" class="nav-item">🏠 Akış</a>
    <a href="market.html" class="nav-item">🛒 Pazar</a>
    <button class="nav-center-btn" onclick="alert('Paylaşım ekranı açılıyor...')">+</button>
    <a href="chat.html" class="nav-item">💬 Sohbet</a>
    <a href="index.html" class="nav-item">👤 Profil</a>
</div>
