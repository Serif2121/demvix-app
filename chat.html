<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>DEMVIX - Sohbet</title>
    <style>
        body { background: #0b0713; color: white; font-family: sans-serif; padding-bottom: 80px; }
        .header { padding: 20px; font-weight: 700; border-bottom: 1px solid #333; }
        .search-bar { padding: 15px; }
        .search-input { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #1a1625; color: white; }
        /* Yeni Sohbet Başlat Butonu */
        .new-chat-btn { position: fixed; bottom: 80px; right: 20px; width: 60px; height: 60px; background: #9333ea; border-radius: 50%; font-size: 30px; display: flex; align-items: center; justify-content: center; border: none; color: white; box-shadow: 0 4px 15px rgba(147, 51, 234, 0.5); }
    </style>
</head>
<body>
    <div class="header">Sohbetler</div>
    <div class="search-bar">
        <input type="text" class="search-input" placeholder="Kullanıcı ara...">
    </div>
    
    <!-- Sohbet Başlatma Butonu -->
    <button class="new-chat-btn" onclick="window.location.href='messages.html'">+</button>

    <!-- Buraya alt menü gelecek (bir sonraki adımda hepsini aynı anda güncelleyeceğiz) -->
</body>
