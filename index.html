<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMVIX - Profil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0b0713 0%, #150f24 100%); color: #ffffff; font-family: sans-serif; padding-bottom: 100px; min-height: 100vh; }
        
        /* Profil Başlık Alanı */
        .profile-header { padding: 40px 20px; text-align: center; }
        .avatar-large { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #ec4899); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 4px solid #1e1830; box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }
        .username { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .user-tag { color: #c084fc; font-size: 14px; font-weight: 600; }

        /* İstatistikler */
        .stats-grid { display: flex; justify-content: space-around; padding: 20px; margin: 0 20px; background: rgba(30, 24, 48, 0.5); border-radius: 20px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 18px; font-weight: 700; color: white; }
        .stat-label { font-size: 11px; color: #9ca3af; margin-top: 4px; }

        /* Rozetler/Ayarlar */
        .menu-list { margin: 20px; }
        .menu-item { background: rgba(30, 24, 48, 0.4); padding: 18px; border-radius: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.05); }

        /* Alt Menü */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(21, 15, 36, 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; padding: 12px 10px; border-top: 1px solid rgba(168, 85, 247, 0.15); z-index: 50; }
        .nav-item { color: #9ca3af; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #c084fc; }
        .nav-center-btn { background: linear-gradient(135deg, #c084fc, #9333ea); color: white; width: 52px; height: 52px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-top: -15px; box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5); }
    </style>
</head>
<body>
    <div class="profile-header">
        <div class="avatar-large">🚀</div>
        <div class="username">Kullanıcı Adı</div>
        <div class="user-tag">@premium_üye</div>
    </div>

    <div class="stats-grid">
        <div class="stat-item"><div class="stat-value">124</div><div class="stat-label">Gönderi</div></div>
        <div class="stat-item"><div class="stat-value">2.4k</div><div class="stat-label">Takipçi</div></div>
        <div class="stat-item"><div class="stat-value">45</div><div class="stat-label">Puan</div></div>
    </div>

    <div class="menu-list">
        <div class="menu-item">⚙️ Ayarlar</div>
        <div class="menu-item">🛡️ Güvenlik</div>
        <div class="menu-item">💳 Ödeme Yöntemleri</div>
    </div>

    <!-- Alt Menü Yapısı -->
<div class="bottom-nav">
    <a href="feed.html" class="nav-item">🏠 Akış</a>
    <a href="market.html" class="nav-item">🛒 Pazar</a>
    <button class="nav-center-btn" onclick="alert('Paylaşım ekranı açılıyor...')">+</button>
    <a href="chat.html" class="nav-item">💬 Sohbet</a>
    <a href="index.html" class="nav-item">👤 Profil</a>
</div>

<style>
    .bottom-nav { 
        position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; 
        background: rgba(21, 15, 36, 0.98); backdrop-filter: blur(20px); 
        display: flex; justify-content: space-around; align-items: center; 
        border-top: 1px solid rgba(168, 85, 247, 0.2); z-index: 999; 
    }
    .nav-item { 
        color: #9ca3af; text-decoration: none; font-size: 10px; 
        display: flex; flex-direction: column; align-items: center; 
        gap: 4px; font-weight: 600; transition: 0.3s;
    }
    .nav-item:hover { color: #c084fc; }
    .nav-center-btn { 
        background: linear-gradient(135deg, #c084fc, #9333ea); 
        color: white; width: 50px; height: 50px; border-radius: 50%; 
        border: none; font-size: 24px; font-weight: bold; cursor: pointer; 
        box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); margin-bottom: 25px; 
    }
</style>
